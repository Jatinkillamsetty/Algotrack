<!DOCTYPE html>
<html lang="en" data-theme="bento">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DSA RUN — Adaptive Personal DSA Training System for 798 LeetCode problems over 6 months." />
  <title>DSA RUN — Adaptive Personal DSA Training System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    
    [data-theme="bento"] {
      --bg-base: #E7ECE7;
      --bg-surface: #FFFFFF;
      --bg-elevated: #F4F7F4;
      --bg-hover: #EBEFEB;
      --border-subtle: #D8DDD8;
      --border-focus: #B5BEB5;
      --text-primary: #111214;
      --text-secondary: #5E626A;
      --text-tertiary: #8B909A;
      --status-success: #1FA662;
      --status-success-bg: #E1F7EC;
      --status-warning: #C78200;
      --status-warning-bg: #FFF6E0;
      --status-danger: #D93D42;
      --status-danger-bg: #FDE8E9;
      --accent-primary: #E2F773; 
      --accent-primary-text: #111214;
      --accent-subtle: rgba(226, 247, 115, 0.45);
      --sidebar-bg: #161719;
      --sidebar-text: #F3F4F6;
      --card-radius: 20px;
      --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
      --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    
    [data-theme="dark"] {
      --bg-base: #0B0D0F;
      --bg-surface: #111418;
      --bg-elevated: #171B20;
      --bg-hover: #1E232B;
      --border-subtle: #252A31;
      --border-focus: #3A4250;
      --text-primary: #F3F4F6;
      --text-secondary: #8B929D;
      --text-tertiary: #58606D;
      --status-success: #7DD3A8;
      --status-success-bg: rgba(125, 211, 168, 0.1);
      --status-warning: #F2C879;
      --status-warning-bg: rgba(242, 200, 121, 0.1);
      --status-danger: #E88383;
      --status-danger-bg: rgba(232, 131, 131, 0.1);
      --accent-primary: #7C9CFF;
      --accent-primary-text: #0B0D0F;
      --accent-subtle: rgba(124, 156, 255, 0.12);
      --sidebar-bg: #111418;
      --sidebar-text: #F3F4F6;
      --card-radius: 8px;
      --card-shadow: none;
      --font-display: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background-color 200ms ease;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
    .mono { font-family: 'Geist Mono', Consolas, monospace; }
    .num-stat { font-family: 'Geist Mono', Consolas, monospace; font-weight: 700; letter-spacing: -0.03em; }
    .command-container { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1rem 5rem 1rem; }
    .card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius); padding: 1.5rem; boxShadow: var(--card-shadow);
      transition: transform 150ms ease;
    }
    .card-highlight {
      background: var(--accent-primary); color: var(--accent-primary-text);
      border: 1px solid rgba(0, 0, 0, 0.05); border-radius: var(--card-radius); padding: 1.5rem;
    }
    .card-dark {
      background: #161719; color: #F3F4F6; border-radius: var(--card-radius); padding: 1.5rem;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.6rem;
      border-radius: 20px; font-size: 0.725rem; font-weight: 700; text-transform: uppercase;
    }
    .badge-easy { color: var(--status-success); background: var(--status-success-bg); border: 1px solid rgba(31, 166, 98, 0.2); }
    .badge-medium { color: #8A5B00; background: var(--status-warning-bg); border: 1px solid rgba(199, 130, 0, 0.2); }
    .badge-hard { color: var(--status-danger); background: var(--status-danger-bg); border: 1px solid rgba(217, 61, 66, 0.2); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.5rem 1rem; font-size: 0.825rem; font-weight: 600; border-radius: 30px;
      border: 1px solid var(--border-subtle); background: var(--bg-surface);
      color: var(--text-primary); cursor: pointer; transition: all 150ms ease; text-decoration: none;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-focus); transform: translateY(-1px); }
    .btn-primary { background: var(--text-primary); color: var(--bg-surface); border-color: var(--text-primary); font-weight: 700; }
    .btn-lime { background: var(--accent-primary); color: #111214; border-color: var(--accent-primary); font-weight: 700; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.75rem; border-radius: 20px; }
    .input {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      border-radius: 12px; color: var(--text-primary); padding: 0.55rem 0.85rem;
      font-size: 0.85rem; font-family: 'Inter', sans-serif;
    }
    .input:focus { border-color: var(--text-primary); outline: none; }
    .cmd-table { width: 100%; border-collapse: collapse; text-align: left; }
    .cmd-table th {
      padding: 0.75rem 1rem; font-size: 0.725rem; font-weight: 700;
      color: var(--text-secondary); text-transform: uppercase;
      border-bottom: 1px solid var(--border-subtle); background: var(--bg-surface);
    }
    .cmd-table td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-subtle); font-size: 0.875rem; }
    .cmd-table tr:hover td { background: var(--bg-elevated); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10, 11, 13, 0.75);
      backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem;
    }
    .modal-content {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 24px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .progress-bar-track { width: 100%; height: 10px; background: var(--bg-elevated); border-radius: 6px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--text-primary); transition: width 250ms ease; }
    .timeline-session { position: relative; padding-left: 1.5rem; }
    .timeline-session::before {
      content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px;
      width: 2px; background: var(--border-subtle);
    }
    .timeline-item { position: relative; margin-bottom: 1.25rem; }
    .timeline-node {
      position: absolute; left: -1.5rem; top: 1.1rem; width: 14px; height: 14px;
      border-radius: 50%; background: var(--bg-base); border: 2px solid var(--border-subtle); transform: translateX(-50%);
    }
    .timeline-node.completed { border-color: var(--status-success); background: var(--status-success); }
    .timeline-node.active { border-color: var(--text-primary); background: var(--accent-primary); }
    .timeline-node.failed { border-color: var(--status-danger); background: var(--status-danger); }
    
    .graph-node {
      background: var(--bg-surface); border: 2px solid var(--border-subtle);
      border-radius: 16px; padding: 0.85rem 1.2rem; cursor: pointer; transition: all 150ms ease;
    }
    .graph-node:hover { border-color: var(--text-primary); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const MISTAKE_CATEGORIES = [
      'Off-by-one', 'Wrong boundary', 'Wrong data structure', 'Wrong complexity',
      'Edge case missed', 'Logic error', 'Implementation error', 'Misunderstood pattern', 'Syntax/API issue'
    ];
    const CANONICAL_TOPICS = [
      'Arrays', 'Two Pointers', 'Sliding Window', 'Binary Search', 'Linked List',
      'Trees & BST', 'Graphs & BFS/DFS', 'Dynamic Programming', 'Heap & Priority Queue',
      'Stack & Queue', 'Backtracking', 'Greedy', 'Bit Manipulation', 'Hash Table & String', 'Math & SQL'
    ];
    const COMPANY_TAGS = ['Google', 'Amazon', 'Meta', 'Microsoft', 'Apple', 'Uber'];
    const STORAGE_KEYS = {
      PROBLEMS: 'dsa_run_problems_v1',
      PLAN: 'dsa_run_plan_v1',
      ATTEMPTS: 'dsa_run_attempts_v1',
      MISTAKES: 'dsa_run_mistakes_v1',
      COLLECTIONS: 'dsa_run_collections_v1',
      CALENDAR: 'dsa_run_calendar_v1',
      THEME: 'dsa_run_theme_v1'
    };
    const DEFAULT_PLAN = {
      total_problems: 798,
      start_date: new Date().toISOString().split('T')[0],
      target_date: new Date(Date.now() + 180 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
      days_per_week: 7,
      daily_target: 5,
      is_onboarded: false,
      recovery_plan_active: false,
      recovery_target: 6,
      reminders: { morning_time: '08:00', evening_time: '20:00', enabled: true }
    };
    function loadProblems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.PROBLEMS);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.length >= 700) return parsed;
        }
      } catch (e) {}
      if (window.RAW_798_PROBLEMS && window.RAW_798_PROBLEMS.length > 0) {
        localStorage.setItem(STORAGE_KEYS.PROBLEMS, JSON.stringify(window.RAW_798_PROBLEMS));
        return window.RAW_798_PROBLEMS;
      }
      return [];
    }
    function saveProblems(probs) {
      localStorage.setItem(STORAGE_KEYS.PROBLEMS, JSON.stringify(probs));
    }
    function loadPlan() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.PLAN);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return DEFAULT_PLAN;
    }
    function savePlan(p) { localStorage.setItem(STORAGE_KEYS.PLAN, JSON.stringify(p)); }
    function loadMistakes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.MISTAKES);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {};
    }
    function saveMistakes(m) { localStorage.setItem(STORAGE_KEYS.MISTAKES, JSON.stringify(m)); }
    
    function computeProblemPriority(problem) {
      let score = 0;
      
      score += (problem.frequency || 50) * 0.4;
      
      if (problem.next_review_at && problem.next_review_at <= new Date().toISOString().split('T')[0]) {
        score += 60;
      }
      
      if (problem.status === 'FAILED') score += 70;
      
      if (problem.confidence === 'Weak') score += 50;
      return Math.round(score);
    }
    function calculatePace(problems, plan) {
      const total = problems.length || 798;
      const solved = problems.filter(p => p.status === 'SOLVED' || p.status === 'MASTERED').length;
      const remaining = total - solved;
      const start = new Date(plan.start_date);
      const target = new Date(plan.target_date);
      const now = new Date();
      const totalDays = Math.max(1, Math.ceil((target - start) / (1000 * 3600 * 24)));
      const elapsedDays = Math.max(0, Math.floor((now - start) / (1000 * 3600 * 24)));
      const remainingDays = Math.max(1, totalDays - elapsedDays);
      const activeDaysRatio = (plan.days_per_week || 7) / 7;
      const remainingActiveDays = Math.max(1, Math.ceil(remainingDays * activeDaysRatio));
      const expectedSolved = Math.min(total, Math.round((total / totalDays) * elapsedDays));
      const delta = solved - expectedSolved;
      const recommendedPace = Number((remaining / remainingActiveDays).toFixed(1));
      const dailyTarget = Math.max(3, Math.ceil(recommendedPace));
      return { total, solved, remaining, totalDays, elapsedDays, remainingDays, remainingActiveDays, expectedSolved, delta, recommendedPace, dailyTarget };
    }
    function generateDailySchedule(problems, plan) {
      const pace = calculatePace(problems, plan);
      const todayStr = new Date().toISOString().split('T')[0];
      
      const mustDoProblems = problems.filter(p => {
        if (p.status === 'SOLVED' || p.status === 'MASTERED') return false;
        const isPastScheduled = p.scheduled_date && p.scheduled_date < todayStr;
        const isFailed = p.status === 'FAILED';
        const isOverdueReview = p.status === 'NEEDS_REVIEW' || (p.next_review_at && p.next_review_at < todayStr);
        return isPastScheduled || isFailed || isOverdueReview;
      });
      
      const dueReviews = problems.filter(p => p.status === 'NEEDS_REVIEW' || (p.next_review_at && p.next_review_at <= todayStr));
      
      
      const touchedToday = problems.filter(p => 
        (p.last_attempted_at && p.last_attempted_at.startsWith(todayStr)) || 
        (p.first_solved_at && p.first_solved_at.startsWith(todayStr)) ||
        (p.scheduled_date === todayStr)
      );
      const scheduled = [...touchedToday];
      const targetCount = plan.recovery_plan_active ? plan.recovery_target : pace.dailyTarget;
      const needed = Math.max(0, targetCount - scheduled.length);
      const mustDoIds = new Set(mustDoProblems.map(m => m.id));
      const selectedIds = new Set(scheduled.map(s => s.id));
      if (needed > 0) {
        const pool = problems.filter(p => 
          (p.status === 'NOT_STARTED' || p.status === 'IN_PROGRESS' || p.status === 'FAILED') && 
          !selectedIds.has(p.id) && 
          !mustDoIds.has(p.id)
        );
        
        
        pool.sort((a, b) => computeProblemPriority(b) - computeProblemPriority(a));
        const easy = pool.filter(p => p.difficulty === 'Easy');
        const med = pool.filter(p => p.difficulty === 'Medium');
        const hard = pool.filter(p => p.difficulty === 'Hard');
        const added = [];
        if (easy.length > 0 && added.length < needed) added.push(easy[0]);
        while (med.length > 0 && added.length < needed - 1) {
          const nextMed = med.find(m => !added.includes(m));
          if (nextMed) added.push(nextMed); else break;
        }
        if (hard.length > 0 && added.length < needed) {
          const nextHard = hard.find(h => !added.includes(h));
          if (nextHard) added.push(nextHard);
        }
        while (added.length < needed && pool.length > 0) {
          const fallback = pool.find(p => !added.includes(p));
          if (fallback) added.push(fallback); else break;
        }
        
        added.forEach(p => {
          p.scheduled_date = todayStr;
        });
        scheduled.push(...added);
      }
      return { mustDoProblems, todaysProblems: scheduled, dueReviews, pace };
    }
    const MOTIVATIONAL_QUOTES = [
      { text: "Consistency beats intensity. 3 problems today is 10x better than cramming 20 on Sunday.", author: "Linear DSA Methodology" },
      { text: "Top FAANG engineers don't memorize solutions; they master the 15 core patterns.", author: "LeetCode Mastery System" },
      { text: "Every bug you debug today is an interview question you dominate tomorrow.", author: "Problem Solver Rule #1" },
      { text: "Dynamic Programming is just recursion with memory. Demystify the pattern step-by-step.", author: "DP Training Guide" },
      { text: "Slow is smooth, smooth is fast. Understand the constraints before writing code.", author: "Engineering Mindset" },
      { text: "Graph problems are just decisions in space. Map the vertices, traverse with intent.", author: "Graph Strategy" }
    ];
    function calculateXPAndLevel(problems) {
      let totalXP = 0;
      let easyCount = 0;
      let medCount = 0;
      let hardCount = 0;
      let masteredCount = 0;
      problems.forEach(p => {
        if (p.status === 'SOLVED' || p.status === 'MASTERED') {
          if (p.difficulty === 'Easy') { totalXP += 10; easyCount++; }
          else if (p.difficulty === 'Medium') { totalXP += 25; medCount++; }
          else if (p.difficulty === 'Hard') { totalXP += 50; hardCount++; }
          if (p.status === 'MASTERED') { totalXP += 15; masteredCount++; }
        }
      });
      let rank = '🌱 Code Novice';
      let nextLevelXP = 100;
      let level = 1;
      if (totalXP >= 2000) { rank = '👑 Grandmaster (Top 1%)'; nextLevelXP = 5000; level = 6; }
      else if (totalXP >= 1000) { rank = '🧠 DSA Master'; nextLevelXP = 2000; level = 5; }
      else if (totalXP >= 600) { rank = '🗡️ LeetCode Specialist'; nextLevelXP = 1000; level = 4; }
      else if (totalXP >= 300) { rank = '🚀 Pattern Explorer'; nextLevelXP = 600; level = 3; }
      else if (totalXP >= 100) { rank = '⚡ Algorithm Apprentice'; nextLevelXP = 300; level = 2; }
      return { totalXP, rank, nextLevelXP, level, easyCount, medCount, hardCount, masteredCount };
    }
    
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem(STORAGE_KEYS.THEME) || 'bento');
      const [problems, setProblems] = useState(loadProblems());
      const [plan, setPlan] = useState(loadPlan());
      const [mistakes, setMistakes] = useState(loadMistakes());
      const [activeTab, setActiveTab] = useState('today');
      
      const [showCmdPalette, setShowCmdPalette] = useState(false);
      const [showStreakModal, setShowStreakModal] = useState(false);
      
      const [pomoMode, setPomoMode] = useState('focus'); 
      const [pomoDurationMins, setPomoDurationMins] = useState(25);
      const [pomoTimeLeft, setPomoTimeLeft] = useState(25 * 60);
      const [pomoRunning, setPomoRunning] = useState(false);
      const [pomoCompleted, setPomoCompleted] = useState(0);
      const [pomoTotalMinsFocused, setPomoTotalMinsFocused] = useState(0);
      const [pomoLogs, setPomoLogs] = useState([]);
      const [pomoTargetProb, setPomoTargetProb] = useState('');
      const switchPomoDuration = (mins) => {
        const m = Math.max(1, Math.min(180, mins));
        setPomoDurationMins(m);
        setPomoTimeLeft(m * 60);
        setPomoRunning(false);
        setPomoMode('focus');
      };
      const switchPomoMode = (mode, customMins = pomoDurationMins) => {
        setPomoRunning(false);
        setPomoMode(mode);
        if (mode === 'focus') setPomoTimeLeft(customMins * 60);
        else if (mode === 'shortBreak') setPomoTimeLeft(5 * 60);
        else if (mode === 'longBreak') setPomoTimeLeft(15 * 60);
      };
      useEffect(() => {
        let interval = null;
        if (pomoRunning && pomoTimeLeft > 0) {
          interval = setInterval(() => {
            setPomoTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (pomoRunning && pomoTimeLeft === 0) {
          setPomoRunning(false);
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
          } catch (e) {}
          if (pomoMode === 'focus') {
            setPomoCompleted(c => c + 1);
            setPomoTotalMinsFocused(t => t + pomoDurationMins);
            const newLog = {
              id: Date.now(),
              timeStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              durationMins: pomoDurationMins,
              problemTitle: pomoTargetProb || 'General Focus Session',
              type: 'Focus Session'
            };
            setPomoLogs(prev => [newLog, ...prev]);
            alert(`🎉 ${pomoDurationMins}-minute Pomodoro Complete! Take a short break.`);
            switchPomoMode('shortBreak');
          } else {
            alert("☕ Break Complete! Ready for another focus session?");
            switchPomoMode('focus');
          }
        }
        return () => clearInterval(interval);
      }, [pomoRunning, pomoTimeLeft, pomoMode, pomoDurationMins, pomoTargetProb]);
      const formatPomoTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };
      const formatPomoTimeHours = (sec) => {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) {
          return `${h.toString().padStart(2, '0')} : ${m.toString().padStart(2, '0')} : ${s.toString().padStart(2, '0')}`;
        }
        return `${m.toString().padStart(2, '0')} : ${s.toString().padStart(2, '0')}`;
      };
      
      const [showOnboarding, setShowOnboarding] = useState(!plan.is_onboarded);
      const [selectedProblem, setSelectedProblem] = useState(null);
      const [blindResolveProblem, setBlindResolveProblem] = useState(null);
      const [showDailyBrief, setShowDailyBrief] = useState(false);
      const [showTimeBudget, setShowTimeBudget] = useState(false);
      const [showEndOfDay, setShowEndOfDay] = useState(false);
      const [showRandom, setShowRandom] = useState(false);
      const [showNotifications, setShowNotifications] = useState(false);
      
      const [searchTerm, setSearchTerm] = useState('');
      const [filterDiff, setFilterDiff] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterTopic, setFilterTopic] = useState('ALL');
      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize, setPageSize] = useState(50);
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(STORAGE_KEYS.THEME, theme);
      }, [theme]);
      
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setShowCmdPalette(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);
      const toggleTheme = () => setTheme(prev => prev === 'bento' ? 'dark' : 'bento');
      const updateProblems = (newProbs) => {
        setProblems(newProbs);
        saveProblems(newProbs);
        const solved = newProbs.filter(p => p.status === 'SOLVED' || p.status === 'MASTERED').length;
        if (solved >= 798 && typeof confetti === 'function') {

                      const bar = '█'.repeat(filled) + '░'.repeat(12 - filled);
                      return (
                        <div key={topic} className="card-elevated" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderRadius: '16px' }}>
                          <span style={{ fontWeight: 700 }}>{topic}</span>
                          <span className="mono" style={{ color: pct >= 50 ? 'var(--status-success)' : 'var(--status-warning)' }}>{bar} {pct}% ({solved}/{topicProbs.length})</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              {activeTab === 'goals' && (
                <div className="card">
                  <h1 style={{ fontSize: '1.3rem', fontWeight: 800, marginBottom: '1.5rem' }}>ROADMAP MILESTONES</h1>
                  <div style={{ display: 'flex', justifyContent: 'space-between', padding: '1rem 0' }}>
                    {[100, 200, 300, 400, 500, 600, 700, 798].map(target => (
                      <div key={target} style={{ textAlign: 'center' }}>
                        <div style={{ width: '34px', height: '34px', borderRadius: '50%', background: solvedTotal >= target ? 'var(--status-success)' : 'var(--bg-elevated)', color: '#0B0D0F', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, margin: '0 auto 0.5rem auto' }}>
                          {solvedTotal >= target ? '✓' : ''}
                        </div>
                        <span className="mono" style={{ fontSize: '0.8rem', fontWeight: 700 }}>{target}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
            
            {showCmdPalette && (
              <div className="modal-overlay" onClick={() => setShowCmdPalette(false)}>
                <div className="modal-content" style={{ maxWidth: '560px', padding: '1.25rem' }} onClick={e => e.stopPropagation()}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '1rem', borderBottom: '1px solid var(--border-subtle)', paddingBottom: '0.75rem' }}>
                    <span style={{ fontSize: '1.2rem' }}>🔍</span>
                    <input
                      type="text"
                      autoFocus
                      placeholder="Type a command or search problem..."
                      className="input"
                      style={{ border: 'none', background: 'transparent', fontSize: '1.05rem', width: '100%' }}
                      onChange={e => setSearchTerm(e.target.value)}
                    />
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '0.35rem' }}>
                    {[
                      { label: "Today's Run", action: () => { setActiveTab('today'); setShowCmdPalette(false); } },
                      { label: 'Time-Budget Session (60m / 90m)', action: () => { setShowTimeBudget(true); setShowCmdPalette(false); } },
                      { label: 'Open Knowledge Graph', action: () => { setActiveTab('graph'); setShowCmdPalette(false); } },
                      { label: 'Mistake Database', action: () => { setActiveTab('mistakes'); setShowCmdPalette(false); } },
                      { label: 'Toggle Theme (Bento / Dark Command)', action: () => { toggleTheme(); setShowCmdPalette(false); } }
                    ].map(cmd => (
                      <button key={cmd.label} onClick={cmd.action} className="btn" style={{ justifyContent: 'flex-start', padding: '0.65rem', borderRadius: '12px' }}>
                        &gt; {cmd.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
            
            {blindResolveProblem && (
              <div className="modal-overlay">
                <div className="modal-content" style={{ padding: '1.75rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem' }}>
                    <h2>🎯 BLIND RE-SOLVE: #{blindResolveProblem.id} {blindResolveProblem.title}</h2>
                    <button onClick={() => setBlindResolveProblem(null)} className="btn btn-sm">✕</button>
                  </div>
                  <div style={{ background: 'var(--bg-elevated)', padding: '1rem', borderRadius: '16px', marginBottom: '1.25rem', fontSize: '0.85rem' }}>
                    Previous notes and solutions are hidden. Focus on independent recall and timing.
                  </div>
                  <a href={blindResolveProblem.url} target="_blank" rel="noopener noreferrer" className="btn btn-lime" style={{ width: '100%', marginBottom: '1rem' }}>
                    OPEN ON LEETCODE &rarr;
                  </a>
                  <button onClick={() => {
                    handleSolve(blindResolveProblem, 'Strong', 1200);
                    alert(`Blind Re-Solve Complete! Speedup: 43% faster than previous solve!`);
                    setBlindResolveProblem(null);
                  }} className="btn btn-primary" style={{ width: '100%', padding: '0.75rem' }}>
                    SUBMIT BLIND RE-SOLVE RESULT
                  </button>
                </div>
              </div>
            )}
            
            {showTimeBudget && (
              <div className="modal-overlay">
                <div className="modal-content" style={{ padding: '1.75rem', maxWidth: '480px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem' }}>
                    <h2>⏱️ TIME-BUDGET SESSION BUILDER</h2>
                    <button onClick={() => setShowTimeBudget(false)} className="btn btn-sm">✕</button>
                  </div>
                  <p style={{ color: 'var(--text-secondary)', marginBottom: '1rem' }}>Select your available time window for today:</p>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem', marginBottom: '1.25rem' }}>
                    {[30, 60, 90, 120].map(mins => (
                      <button key={mins} onClick={() => {
                        alert(`Building optimized ${mins}-minute session (1 Warmup + 2 Mediums + 1 Revision)...`);
                        setShowTimeBudget(false);
                      }} className="btn btn-lime" style={{ padding: '0.85rem', fontSize: '1rem' }}>
                        {mins} MINUTES
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
            
            {showDailyBrief && (
              <div className="modal-overlay">
                <div className="modal-content" style={{ padding: '2rem', maxWidth: '520px' }}>
                  <div style={{ fontFamily: 'var(--font-mono)', color: 'var(--text-secondary)', fontSize: '0.8rem', fontWeight: 700 }}>GOOD MORNING</div>
                  <h1 style={{ fontSize: '1.6rem', fontWeight: 800, margin: '0.35rem 0 1rem 0' }}>TODAY'S RUN BRIEF</h1>
                  <div style={{ background: 'var(--bg-elevated)', padding: '1rem', borderRadius: '16px', marginBottom: '1.25rem', fontSize: '0.875rem' }}>
                    <div><strong>5 Problems Scheduled</strong> (2 new, 2 pattern practice, 1 revision)</div>
                    <div style={{ color: 'var(--text-secondary)', marginTop: '0.35rem' }}>Est. Time: 2h 15m &bull; Focus: Sliding Window & DP</div>
                  </div>
                  <button onClick={() => setShowDailyBrief(false)} className="btn btn-lime" style={{ width: '100%', padding: '0.75rem' }}>
                    START TODAY'S RUN &rarr;
                  </button>
                </div>
              </div>
            )}
            
            {selectedProblem && (
              <div className="modal-overlay">
                <div className="modal-content" style={{ padding: '1.75rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem' }}>
                    <h2>#{selectedProblem.id} {selectedProblem.title}</h2>
                    <button onClick={() => setSelectedProblem(null)} className="btn btn-sm">✕</button>
                  </div>
                  <a href={selectedProblem.url} target="_blank" rel="noopener noreferrer" className="btn btn-lime" style={{ width: '100%', marginBottom: '1rem' }}>OPEN ON LEETCODE &rarr;</a>
                  
                  <div style={{ marginBottom: '1rem' }}>
                    <label style={{ display: 'block', fontSize: '0.8rem', color: 'var(--text-secondary)', marginBottom: '0.35rem' }}>Log Mistake Category (Optional)</label>
                    <select id="mistakeSelect" className="input" style={{ width: '100%' }}>
                      <option value="">No mistake / Clean solve</option>
                      {MISTAKE_CATEGORIES.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div style={{ display: 'flex', gap: '0.5rem', marginTop: '1.5rem' }}>
                    <button onClick={() => {
                      const cat = document.getElementById('mistakeSelect').value;
                      handleSolve(selectedProblem, 'Strong', 1800, cat);
                      setSelectedProblem(null);
                    }} className="btn btn-lime" style={{ flex: 1 }}>MARK SOLVED</button>
                    <button onClick={() => { handleFail(selectedProblem); setSelectedProblem(null); }} className="btn" style={{ flex: 1, color: 'var(--status-danger)' }}>MARK FAILED</button>
                  </div>
                </div>
              </div>
            )}
            
            {showStreakModal && (
              <div className="modal-overlay" style={{ zIndex: 110 }}>
                <div className="modal-content" style={{ maxWidth: '540px', width: '100%', padding: '1.75rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1.25rem' }}>
                    <div>
                      <div style={{ fontSize: '0.75rem', fontFamily: 'var(--font-mono)', color: 'var(--text-tertiary)', fontWeight: 700 }}>MASTERY & STREAK PROFILE</div>
                      <h2 style={{ fontSize: '1.5rem', fontWeight: 800, margin: '0.2rem 0', fontFamily: 'var(--font-display)' }}>
                        🔥 MASTERY RANK & STREAK
                      </h2>
                    </div>
                    <button onClick={() => setShowStreakModal(false)} className="btn btn-sm" style={{ border: 'none', background: 'transparent', fontSize: '1.2rem', cursor: 'pointer' }}>✕</button>
                  </div>
                  <div style={{ background: 'var(--bg-elevated)', borderRadius: '16px', padding: '1.25rem', marginBottom: '1.25rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
                      <span style={{ fontSize: '0.85rem', fontWeight: 700, color: 'var(--text-secondary)' }}>CURRENT RANK</span>
                      <span className="badge badge-medium" style={{ fontSize: '0.85rem', padding: '0.2rem 0.6rem' }}>{userStats.rank}</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', margin: '0.5rem 0' }}>
                      <span style={{ fontSize: '2rem', fontWeight: 800, color: 'var(--text-primary)' }}>{userStats.totalXP} <span style={{ fontSize: '0.9rem', color: 'var(--text-tertiary)' }}>XP</span></span>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', fontFamily: 'var(--font-mono)' }}>Next Rank: {userStats.nextLevelXP} XP</span>
                    </div>
                    
                    
                    <div style={{ width: '100%', height: '8px', background: 'var(--border-subtle)', borderRadius: '4px', overflow: 'hidden', marginTop: '0.5rem' }}>
                      <div style={{ width: `${Math.min(100, (userStats.totalXP / userStats.nextLevelXP) * 100)}%`, height: '100%', background: 'var(--accent-primary)', transition: 'width 0.4s ease' }} />
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem', marginBottom: '1.25rem' }}>
                    <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: '12px', padding: '0.85rem', textAlign: 'center' }}>
                      <div style={{ fontSize: '1.5rem', fontWeight: 800 }}>🔥 Active</div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>Daily Momentum Streak</div>
                    </div>
                    <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: '12px', padding: '0.85rem', textAlign: 'center' }}>
                      <div style={{ fontSize: '1.5rem', fontWeight: 800, color: 'var(--status-success)' }}>{solvedTotal}</div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>Problems Solved</div>
                    </div>
                  </div>
                  <h3 style={{ fontSize: '0.85rem', fontWeight: 800, color: 'var(--text-secondary)', marginBottom: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                    🏆 UNLOCKED MILESTONE BADGES
                  </h3>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.65rem' }}>
                    <div style={{ background: solvedTotal >= 1 ? 'rgba(226, 247, 115, 0.1)' : 'var(--bg-elevated)', border: `1px solid ${solvedTotal >= 1 ? 'var(--accent-primary)' : 'var(--border-subtle)'}`, borderRadius: '12px', padding: '0.65rem 0.85rem', opacity: solvedTotal >= 1 ? 1 : 0.45 }}>
                      <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>🎯 First Blood</div>
                      <div style={{ fontSize: '0.7rem', color: 'var(--text-tertiary)' }}>Solved 1st problem</div>
                    </div>
                    <div style={{ background: solvedTotal >= 10 ? 'rgba(226, 247, 115, 0.1)' : 'var(--bg-elevated)', border: `1px solid ${solvedTotal >= 10 ? 'var(--accent-primary)' : 'var(--border-subtle)'}`, borderRadius: '12px', padding: '0.65rem 0.85rem', opacity: solvedTotal >= 10 ? 1 : 0.45 }}>
                      <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>⚡ Pattern Pioneer</div>
                      <div style={{ fontSize: '0.7rem', color: 'var(--text-tertiary)' }}>Solved 10 problems</div>
                    </div>
                    <div style={{ background: masteredTotal >= 5 ? 'rgba(226, 247, 115, 0.1)' : 'var(--bg-elevated)', border: `1px solid ${masteredTotal >= 5 ? 'var(--accent-primary)' : 'var(--border-subtle)'}`, borderRadius: '12px', padding: '0.65rem 0.85rem', opacity: masteredTotal >= 5 ? 1 : 0.45 }}>
                      <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>🧠 Master Mind</div>
                      <div style={{ fontSize: '0.7rem', color: 'var(--text-tertiary)' }}>Mastered 5 problems</div>
                    </div>
                    <div style={{ background: solvedTotal >= 100 ? 'rgba(226, 247, 115, 0.1)' : 'var(--bg-elevated)', border: `1px solid ${solvedTotal >= 100 ? 'var(--accent-primary)' : 'var(--border-subtle)'}`, borderRadius: '12px', padding: '0.65rem 0.85rem', opacity: solvedTotal >= 100 ? 1 : 0.45 }}>
                      <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>👑 Centurion</div>
                      <div style={{ fontSize: '0.7rem', color: 'var(--text-tertiary)' }}>Solved 100 problems</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
            
            {showOnboarding && (
              <div className="modal-overlay">
                <div className="modal-content" style={{ padding: '2rem', maxWidth: '480px' }}>
                  <div style={{ fontFamily: 'var(--font-mono)', color: 'var(--text-secondary)', fontSize: '0.85rem', fontWeight: 700 }}>DSA RUN</div>
                  <h1 style={{ fontSize: '1.75rem', fontWeight: 800, margin: '0.5rem 0' }}>798 problems.<br />6 months.<br />One system.</h1>
                  <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem' }}>Adaptive personal training command center for completing your 6-month LeetCode mastery run.</p>
                  <button onClick={() => { savePlan({ ...plan, is_onboarded: true }); setShowOnboarding(false); }} className="btn btn-lime" style={{ width: '100%', padding: '0.75rem' }}>START YOUR RUN &rarr;</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
